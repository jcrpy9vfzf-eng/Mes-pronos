<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Alban ou Gaspard ?</title>

  <!-- Métadonnées PWA pour iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prénom Bébé">
  <link rel="apple-touch-icon" href="https://fav.farm/👶">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --alban: #38bdf8;     /* Bleu */
      --gaspard: #10b981;   /* Vert émeraude */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    header {
      text-align: center;
      margin-top: 15px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 6px 0;
      font-weight: 700;
    }

    .countdown {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .scores-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 420px;
      margin: 20px 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card.alban { border-top: 4px solid var(--alban); }
    .card.gaspard { border-top: 4px solid var(--gaspard); }

    .name {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card.alban .name { color: var(--alban); }
    .card.gaspard .name { color: var(--gaspard); }

    .counter {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      margin: 12px 0 18px 0;
    }

    .vote-btn {
      width: 100%;
      padding: 14px 10px;
      border-radius: 16px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s;
    }

    .vote-btn:active {
      transform: scale(0.96);
    }

    .card.alban .vote-btn { background: var(--alban); }
    .card.gaspard .vote-btn { background: var(--gaspard); }

    .vote-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 12px 18px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .undo-btn {
      background: none;
      border: none;
      color: #f87171;
      font-size: 0.8rem;
      text-decoration: underline;
      margin-top: 6px;
      cursor: pointer;
      display: inline-block;
    }

    .history-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      margin-top: 15px;
      max-height: 170px;
      overflow-y: auto;
    }

    .history-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Tirage au sort Bébé</h1>
    <div class="countdown" id="countdown">Terme : 15 nov. 2026 (13 jours restants)</div>
  </header>

  <div class="scores-grid">
    <div class="card alban">
      <div class="name">Alban</div>
      <div class="counter" id="count-alban">1</div>
      <button class="vote-btn" id="btn-alban" onclick="enregistrerVote('Alban')">+1 Alban</button>
    </div>

    <div class="card gaspard">
      <div class="name">Gaspard</div>
      <div class="counter" id="count-gaspard">0</div>
      <button class="vote-btn" id="btn-gaspard" onclick="enregistrerVote('Gaspard')">+1 Gaspard</button>
    </div>
  </div>

  <div class="status-box">
    <div id="status-msg">Prêt pour le tirage du jour !</div>
    <button id="undo-btn" class="undo-btn" style="display: none;" onclick="annulerDernierVote()">Annuler le tirage d'aujourd'hui</button>
  </div>

  <div class="history-card">
    <div class="history-title">Historique des tirages</div>
    <div id="history-list">
      <div class="history-item">
        <span>01/11</span>
        <strong style="color: var(--alban)">Alban</strong>
      </div>
    </div>
  </div>

  <script>
    var STORAGE_KEY = 'bebe_votes_data_v4';
    var DUE_DATE = new Date(2026, 10, 15, 0, 0, 0);

    function getTodayString() {
      var d = new Date();
      var m = String(d.getMonth() + 1);
      if (m.length < 2) m = '0' + m;
      var jour = String(d.getDate());
      if (jour.length < 2) jour = '0' + jour;
      return d.getFullYear() + '-' + m + '-' + jour;
    }

    function chargerDonnees() {
      var parDefaut = [{ date: '2026-11-01', choice: 'Alban' }];
      try {
        var brute = localStorage.getItem(STORAGE_KEY);
        if (brute) {
          var parsed = JSON.parse(brute);
          if (parsed && Array.isArray(parsed.votes) && parsed.votes.length > 0) {
            return parsed.votes;
          }
        }
      } catch (err) {}
      sauvegarderDonnees(parDefaut);
      return parDefaut;
    }

    function sauvegarderDonnees(votes) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ votes: votes }));
      } catch (err) {}
    }

    var votes = chargerDonnees();

    function actualiserCompteARebours() {
      var maintenant = new Date();
      var diffMilli = DUE_DATE.getTime() - maintenant.getTime();
      var jours = Math.ceil(diffMilli / (1000 * 60 * 60 * 24));
      var el = document.getElementById('countdown');
      if (!el) return;

      if (jours > 1) {
        el.textContent = "Terme : 15 nov. 2026 (" + jours + " jours restants)";
      } else if (jours === 1) {
        el.textContent = "Terme : demain 15 nov. 2026 !";
      } else if (jours === 0) {
        el.textContent = "Terme aujourd'hui 15 nov. 2026 ! 🎉";
      } else {
        el.textContent = "Bébé est arrivé ! 👶";
      }
    }

    function actualiserAffichage() {
      var totalAlban = 0;
      var totalGaspard = 0;
      for (var i = 0; i < votes.length; i++) {
        if (votes[i].choice === 'Alban') totalAlban++;
        if (votes[i].choice === 'Gaspard') totalGaspard++;
      }

      document.getElementById('count-alban').textContent = totalAlban;
      document.getElementById('count-gaspard').textContent = totalGaspard;

      var aujourdhui = getTodayString();
      var voteAujourdhui = null;
      for (var j = 0; j < votes.length; j++) {
        if (votes[j].date === aujourdhui) {
          voteAujourdhui = votes[j];
          break;
        }
      }

      var btnAlban = document.getElementById('btn-alban');
      var btnGaspard = document.getElementById('btn-gaspard');
      var statusMsg = document.getElementById('status-msg');
      var undoBtn = document.getElementById('undo-btn');

      if (voteAujourdhui) {
        btnAlban.disabled = true;
        btnGaspard.disabled = true;
        statusMsg.innerHTML = "Tirage validé aujourd'hui : <strong>" + voteAujourdhui.choice + "</strong> ✨";
        undoBtn.style.display = 'inline-block';
      } else {
        btnAlban.disabled = false;
        btnGaspard.disabled = false;
        statusMsg.textContent = "Aucun tirage validé aujourd'hui. À vous de jouer !";
        undoBtn.style.display = 'none';
      }

      var historyList = document.getElementById('history-list');
      historyList.innerHTML = '';
      
      // Afficher du plus récent au plus ancien
      for (var k = votes.length - 1; k >= 0; k--) {
        var v = votes[k];
        var item = document.createElement('div');
        item.className = 'history-item';
        
        var dateAffichee = v.date;
        var parts = v.date.split('-');
        if (parts.length === 3) {
          dateAffichee = parts[2] + '/' + parts[1];
        }

        var couleur = (v.choice === 'Alban') ? 'var(--alban)' : 'var(--gaspard)';
        item.innerHTML = '<span>' + dateAffichee + '</span><strong style="color: ' + couleur + '">' + v.choice + '</strong>';
        historyList.appendChild(item);
      }
    }

    function enregistrerVote(prenom) {
      var aujourdhui = getTodayString();
      for (var i = 0; i < votes.length; i++) {
        if (votes[i].date === aujourdhui) return;
      }
      votes.push({ date: aujourdhui, choice: prenom });
      sauvegarderDonnees(votes);
      actualiserAffichage();
    }

    function annulerDernierVote() {
      var aujourdhui = getTodayString();
      votes = votes.filter(function(v) { return v.date !== aujourdhui; });
      sauvegarderDonnees(votes);
      actualiserAffichage();
    }

    actualiserCompteARebours();
    actualiserAffichage();
  </script>
</body>
</html>
